# Amplify Hosting build for Next.js SSR (platform WEB_COMPUTE).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify console env vars only exist during the build, not on the
        # SSR server that handles requests. Write the ones the server needs
        # into .env.production so Next.js loads them at runtime.
        # (|| true keeps the build alive if a var group isn't set yet.)
        - env | grep -e NEON_CONNECTION_STRING -e COGNITO_ -e GEMINI_ >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
